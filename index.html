<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#004552">
    <meta name="description" content="Aplicación Web Progresiva de Farmacia El Ángel de tu Salud">
    <title>Farmacia El Ángel de tu Salud</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    
    <header class="top">
        <div class="brand">
            <h1>Farmacia "El Ángel"</h1>
            <p class="subtitle">Salud y bienestar para tu familia</p>
        </div>
        <span class="status online" id="status">En línea</span>
    </header>

    
    <main class="main-container">
        
        <!-- Panel de Registro / Búsqueda -->
        <section class="panel">
            <h2>Gestión de Catálogo / Productos</h2>
            <form id="form" novalidate>
                <div class="field">
                    <label for="codigo">Código del Producto</label>
                    <input type="text" id="codigo" name="codigo" placeholder="Ej. MED001" autocomplete="off" required>
                    <small class="error" id="err-codigo"></small>
                </div>
                
                <div class="field">
                    <label for="producto">Nombre del Medicamento / Producto</label>
                    <input type="text" id="producto" name="producto" placeholder="Ej. Paracetamol 500mg" autocomplete="off" required>
                    <small class="error" id="err-producto"></small>
                </div>
                
                <div class="field">
                    <label for="precio">Precio de Referencia ($)</label>
                    <input type="text" id="precio" name="precio" inputmode="decimal" placeholder="0.00" required>
                    <small class="error" id="err-precio"></small>
                </div>
                
                <div class="actions">
                    <button type="submit" id="save" class="btn btn-save">Guardar Producto</button>
                    <button type="reset" id="cancel" class="btn btn-cancel">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- Panel de Visualización del Catálogo -->
        <section class="panel">
            <div class="panel-header">
                <h2>Inventario Local (<span id="contador">0</span>)</h2>
            </div>
            
            <ul id="lista" class="lista-productos">
                
            </ul>
            
            <p id="vacio" class="vacio-msj">No hay productos registrados en el sistema.</p>
        </section>

    </main>

    <!-- Notificación flotante -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
