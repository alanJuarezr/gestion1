<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#006666">
    <title>Farmacia El Ángel de tu Salud</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header class="top">
        <div class="brand">
            <h1>Farmacia "El Ángel"</h1>
            <p class="subtitle">Sistema Integral de Gestión</p>
        </div>
        
        <!-- Contenedor del estado y botón de cerrar sesión -->
        <div style="display: flex; align-items: center; gap: 15px;">
            <div id="user-info-container"></div>
            <span class="status online" id="status">En línea</span>
        </div>
    </header>

    <!-- Navegación SPA para los 5 módulos del equipo -->
    <nav class="navbar">
        <button class="nav-btn active">Medicamentos</button>
        <button class="nav-btn" disabled title="Módulo de Karla">Clientes</button>
        <button class="nav-btn" disabled title="Módulo de Marco">Proveedores</button>
        <button class="nav-btn" disabled title="Módulo de Carlos">Ventas</button>
        <button class="nav-btn" disabled title="Módulo de Vanessa">Usuarios</button>
    </nav>

    <main class="main-container">
        <!-- Formulario CRUD Medicamentos -->
        <section class="panel">
            <h2 id="form-titulo">Registrar Medicamento</h2>
            <form id="form" novalidate>
                <input type="hidden" id="med-id">

                <div class="field">
                    <label for="codigo">Código *</label>
                    <input type="text" id="codigo" name="codigo" placeholder="Ej. MED-001" required>
                </div>

                <div class="field">
                    <label for="nombre">Nombre del Medicamento *</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Paracetamol 500mg" required>
                </div>

                <div class="field">
                    <label for="descripcion">Descripción / Presentación</label>
                    <textarea id="descripcion" name="descripcion" rows="2" placeholder="Caja con 20 tabletas..."></textarea>
                </div>

                <div class="row-fields">
                    <div class="field">
                        <label for="precio">Precio ($) *</label>
                        <input type="number" step="0.01" id="precio" name="precio" placeholder="0.00" required>
                    </div>
                    <div class="field">
                        <label for="stock">Stock (Piezas) *</label>
                        <input type="number" id="stock" name="stock" placeholder="0" required>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" id="save" class="btn btn-save">Guardar</button>
                    <button type="button" id="cancel" class="btn btn-cancel" hidden>Cancelar Edición</button>
                </div>
            </form>
        </section>

        <!-- Tabla de Resultados desde MySQL -->
        <section class="panel">
            <h2>Inventario en Base de Datos (<span id="contador">0</span>)</h2>
            <div id="lista" class="lista-productos"></div>
            <p id="vacio" class="vacio-msj">No hay medicamentos registrados en MySQL.</p>
        </section>
    </main>

   
   

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- 1. Primero va el Modal de Login -->
    <div id="login-modal" class="login-overlay">
        <div class="login-card">
            <h2>Acceso Administrativo</h2>
            <p class="subtitle">Farmacia "El Ángel de tu Salud"</p>
            
            <form id="form-login">
                <div class="field">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" value="admin@farmacia.com" required>
                </div>
                <div class="field">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" value="admin123" required>
                </div>
                <button type="submit" class="btn btn-save" style="width: 100%; margin-top: 10px;">Ingresar al Sistema</button>
            </form>
            <small style="display:block; text-align:center; margin-top:15px; color:#64748b;">Credencial por defecto: admin@farmacia.com / admin123</small>
        </div>
    </div>

    <!-- 2. Al final se carga el script para que detecte todos los elementos -->
    <script src="app.js"></script>
</body>
</html>


</body>
</html>
